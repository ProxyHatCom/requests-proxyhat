[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "requests-proxyhat"
version = "0.1.0"
description = "requests Session for ProxyHat residential proxies — sticky sessions, rotation, geo-targeting, socks5."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ProxyHat", email = "support@proxyhat.com" }]
keywords = [
    "requests",
    "proxy",
    "residential-proxy",
    "proxyhat",
    "web-scraping",
    "http-session",
    "sticky-session",
    "rotating-proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = ["requests>=2.25", "proxyhat>=0.2.0"]

[project.urls]
Homepage = "https://proxyhat.com"
Documentation = "https://docs.proxyhat.com"
Repository = "https://github.com/ProxyHatCom/requests-proxyhat"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/requests_proxyhat"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
